<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/multimedia/Sunners logo simple.png">
    <link rel="stylesheet" type="text/css" href="/archivos/contacto.css">
    <title>Contacto-Sunners</title>
</head>
<body>
    <div class="div-form">
      <section>
        <h1>Contacta con Sunners</h1>
        <form action="/index.html" method="post">
                <article>
                    <label for="name">Nombre: : </label>
                    <input type="text" placeholder="Su nombre aquí" required>
                </article>
                <article>
                    <label for="correo">Correo Electrónico: </label>
                    <input type="email" placeholder="tucorreo@gmail.com" required>
                </article>
                <article>
                    <label for="telefono">Teléfono: </label>
                    <input type="tel" placeholder="+34 699 619 957" required>
                </article>
                <article>
                    <label form="casa">Seleccione el lugar de la instalación</label>
                    <select required>
                        <option value="0"></option>
                        <option value="casa">casa unifamiliar</option>
                        <option value="nave">instalacion industrial</option>
                        <option value="comunidad">comunidad energética</option>
                        <option value="vecinos">comunidad de vecinos</option>
                    </select>
                    
                </article>
                <article>
                    <p>Si deseas introduzca aqui archivos con sus datos de consumo anual para poder ser más concretos con su proyecto al ponernos en contacto con usted.</p>
                    <label for="archivos">Consumos: </label>
                    <input type="file" placeholder="suba su consumo anual">
                </article>
                <div class="boton">
                    <button type="submit">Contacta conmigo</button>
                </div>
                
            </form>
            
            <div class="botones">
                <button><img alt="phone" src="/multimedia/Icono-whatsapp.jpg"><p>+34 699 619 957</p></button>
                <button><img alt="mail" src="/multimedia/Icono-mail.jpg"><p>contacto@sunners.es</p></button>
            </div>
    </section>  
    </div>
    
    
</body>
</html>
